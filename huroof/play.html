<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>إنسان حيوان جماد | المشارك</title>
<meta name="description" content="ادخل برمز الغرفة وعبّ ورقتك: إنسان، حيوان، جماد، بلاد.">
<meta name="theme-color" content="#0A2463">
<!-- تطبيق الثيم المحفوظ قبل الرسم لتفادي الوميض -->
<script>
(function(){
  var t=null;
  try{ t=localStorage.getItem('athar-theme'); }catch(e){}
  if(['light','navy','blue'].indexOf(t)<0){
    t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'navy':'light';
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/athar.css">
<link rel="stylesheet" href="style.css">
<!-- إحصائيات الزيارات (Google Analytics) -->
<script src="../assets/athar-analytics.js" defer></script>
</head>
<body class="play">

<!-- ============ الشريط العلوي ============ -->
<header class="topbar">
  <a class="brand" href="./" aria-label="إنسان حيوان جماد">
    <img class="logo logo-main" src="../assets/athar-mark.png" alt="" width="52" height="60">
    <img class="logo logo-rev" src="../assets/athar-mark-reversed.png" alt="" width="52" height="60">
    <span class="brand-text">
      <strong id="meName">إنسان حيوان جماد</strong>
      <small id="meRoom">ادخل برمز الغرفة</small>
    </span>
  </a>
  <div class="top-tools">
    <span class="net" id="netDot" data-on="false" title="حالة الاتصال"><i></i><b id="netText">يتصل…</b></span>
    <button class="icon-btn snd" id="soundBtn" aria-pressed="true" aria-label="المؤثرات الصوتية">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>
    <div class="theme-switch" role="group" aria-label="ألوان الواجهة">
      <button class="theme-dot" data-set-theme="light" aria-label="الثيم الفاتح" aria-pressed="false"></button>
      <button class="theme-dot" data-set-theme="navy" aria-label="الثيم الكحلي" aria-pressed="false"></button>
      <button class="theme-dot" data-set-theme="blue" aria-label="ثيم أزرق أثَر" aria-pressed="false"></button>
    </div>
  </div>
</header>

<main>

  <!-- ============ ١) الدخول ============ -->
  <section class="screen active" id="screen-join">
    <form class="setup join" id="joinForm" autocomplete="off" novalidate>
      <div class="setup-hero">
        <div class="hero-sheet small" aria-hidden="true">
          <svg viewBox="0 0 260 170">
            <g class="paper">
              <rect x="14" y="10" width="232" height="150" rx="10"/>
              <path class="rule" d="M14 52h232M14 78h232M14 104h232M14 130h232"/>
              <path class="margin" d="M214 10v150"/>
              <path class="cols" d="M170 28v132M126 28v132M82 28v132"/>
              <path class="head" d="M14 28h232"/>
              <g class="heads"><rect x="176" y="16" width="30" height="6" rx="3"/><rect x="134" y="16" width="28" height="6" rx="3"/><rect x="90" y="16" width="28" height="6" rx="3"/><rect x="40" y="16" width="34" height="6" rx="3"/></g>
              <path class="ink i1" d="M200 45c-6-6-14 3-20-1s-6-5-10 0"/>
              <path class="ink i2" d="M160 45c-5-5-11 4-16 0s-8-4-12 1"/>
              <path class="ink i3" d="M116 45c-5-6-12 3-18 0s-6-4-10 1"/>
              <path class="ink i4" d="M70 71c-6-5-12 4-19 0s-8-4-13 1"/>
            </g>
            <g class="pencil">
              <path class="p-body" d="M62 92l78-46 9 15-78 46z"/>
              <path class="p-band" d="M140 46l6-4 9 15-6 4z"/>
              <path class="p-eraser" d="M146 42l9-5a4 4 0 0 1 5 2l5 8a4 4 0 0 1-2 5l-9 5z"/>
              <path class="p-wood" d="M62 92l9 15-17 2z"/>
              <path class="p-tip" d="M58 101l-4 8 6-1z"/>
            </g>
          </svg>
          <span class="hero-letter">ب</span>
        </div>
        <h1>جهّز ورقتك</h1>
        <p class="lead">اكتب رمز الغرفة اللي على شاشة المقدّم واسمك، وخلّ قلمك جاهز.</p>
      </div>
      <div class="card">
        <label class="field">
          <span>رمز الغرفة</span>
          <input type="text" id="codeInput" class="code-input" inputmode="numeric" maxlength="5" placeholder="٠٠٠٠٠" dir="ltr" required>
        </label>
        <label class="field">
          <span>اسمك</span>
          <input type="text" id="nameInput" maxlength="20" placeholder="مثل: أبو فهد" required>
        </label>
        <p class="error" id="joinError" role="alert" hidden></p>
      </div>
      <button class="btn btn-primary btn-big" id="joinBtn" type="submit">ادخل الغرفة</button>
      <a class="home-link" href="./">أنا المقدّم ←</a>
    </form>
  </section>

  <!-- ============ ٢) الورقة ============ -->
  <section class="screen" id="screen-game">
    <div class="game" id="game" data-ph="wait">

      <!-- رأس الورقة: الحرف والجولة والوقت -->
      <div class="game-head">
        <div class="stamp" id="myLetter" aria-label="حرف الجولة">؟</div>
        <div class="gh-text">
          <div class="gh-pills">
            <span class="pill" id="myRound"></span>
            <span class="pill timer-pill" id="myTimer" hidden></span>
          </div>
          <h1 id="statusTitle">لحظة…</h1>
          <p id="statusText">نوصّلك بالغرفة</p>
        </div>
      </div>
      <div class="timebar" id="myTimebar" hidden><i id="myTimefill"></i></div>

      <!-- خانات الكتابة -->
      <form class="paper-form" id="sheetForm" autocomplete="off" novalidate>
        <div class="lines" id="lines"></div>
        <button class="btn btn-go btn-big btn-done" id="doneBtn" type="submit" disabled>
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 34V14a4 4 0 0 1 8 0v16-20a4 4 0 0 1 8 0v20-16a4 4 0 0 1 8 0v18-10a4 4 0 0 1 8 0v18c0 12-8 20-19 20-7 0-12-3-16-9l-8-12a4 4 0 0 1 6-5z"/></svg>
          <span id="doneLabel">سلّمت!</span>
        </button>
        <p class="hint" id="doneHint"></p>
      </form>

      <!-- نتيجتي في الجولة -->
      <div class="result card" id="result" hidden>
        <div class="res-top">
          <div><span class="muted">مجموع الجولة</span><strong class="res-round" id="resRound"></strong></div>
          <div><span class="muted">مجموعك الكلي</span><strong id="resTotal"></strong></div>
          <div><span class="muted">ترتيبك</span><strong id="resRank"></strong></div>
        </div>
        <p class="graded-wrap"><span class="graded-by" id="gradedBy" hidden></span></p>
      </div>

      <!-- لوحة الجولة: التصحيح وهو يصير، والإجابات، والترتيب -->
      <div class="live-board card" id="liveBoard" hidden>
        <div class="lb-top"><h2 id="lbTitle">التصحيح</h2><span class="muted" id="lbSub"></span></div>
        <div class="lb-rank-wrap" id="lbRankWrap" hidden>
          <h3>الترتيب</h3>
          <ol class="lb-rank" id="lbRank"></ol>
        </div>
        <ul class="lb-list" id="lbList"></ul>
      </div>

      <!-- الفائز -->
      <div class="end-card card" id="endCard" hidden>
        <span class="kicker" id="endKicker"></span>
        <h2 id="endTitle"></h2>
        <p class="muted" id="endText"></p>
      </div>

      <!-- ورقتي: كل الجولات -->
      <div class="my-paper" id="myPaper" hidden>
        <h2>ورقتي</h2>
        <div class="table-wrap"><table class="sheet mine" id="paperTable"></table></div>
      </div>

      <button class="btn btn-ghost btn-small leave" id="leaveBtn">اطلع من الغرفة</button>
    </div>
  </section>

</main>

<!-- قف! يغطي الشاشة لحظة أول تسليم -->
<div class="stop-overlay" id="stopOverlay" hidden>
  <div class="stop-banner">
    <div class="stop-hand" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M22 34V14a4 4 0 0 1 8 0v16-20a4 4 0 0 1 8 0v20-16a4 4 0 0 1 8 0v18-10a4 4 0 0 1 8 0v18c0 12-8 20-19 20-7 0-12-3-16-9l-8-12a4 4 0 0 1 6-5z"/></svg>
    </div>
    <h2 class="stop-word">قف!</h2>
    <p class="stop-who" id="ovWho"></p>
  </div>
</div>

<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" hidden></div>

<div class="modal" id="confirm" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="confirmYes"></button>
      <button class="btn" id="confirmNo">إلغاء</button>
    </div>
  </div>
</div>

<script src="firebase-config.js" defer></script>
<script src="../assets/athar-sound.js" defer></script>
<script src="net.js" defer></script>
<script src="shared.js" defer></script>
<script src="play.js" defer></script>
</body>
</html>
