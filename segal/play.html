<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="fest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>سِجَال | المشارك</title>
<meta name="description" content="ادخل ساحة سِجَال برمز الغرفة، واختر فريقك، والعب الفقرات من جوالك.">
<meta name="theme-color" content="#170F33">
<script>
(function(){
  var t=null;
  try{ t=localStorage.getItem('athar-fazaa-theme'); }catch(e){}
  if(['fest','light','navy','blue'].indexOf(t)<0) t='fest';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/athar.css">
<link rel="stylesheet" href="style.css?v=202611280004">
<script src="../assets/athar-analytics.js" defer></script>
</head>
<body class="play">

<div class="sky" aria-hidden="true"><div class="lights"></div></div>

<header class="topbar">
  <a class="brand" href="./play.html" aria-label="سِجَال">
    <img class="logo logo-main" src="../assets/athar-mark.png" alt="" width="52" height="60">
    <img class="logo logo-rev" src="../assets/athar-mark-reversed.png" alt="" width="52" height="60">
    <span class="brand-text"><strong id="meName">سِجَال</strong><small id="meRoom">ادخل برمز الغرفة</small></span>
  </a>
  <div class="top-tools">
    <span class="net" id="netDot" data-on="false" title="حالة الاتصال"><i></i><b id="netText">يتصل…</b></span>
    <button class="icon-btn snd" id="soundBtn" aria-pressed="true" aria-label="المؤثرات الصوتية">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>
    <div class="theme-switch" role="group" aria-label="ألوان الواجهة">
      <button class="theme-dot sw-fest" data-set-theme="fest" aria-label="ليل الساحة" aria-pressed="false"></button>
      <button class="theme-dot" data-set-theme="light" aria-label="الثيم الفاتح" aria-pressed="false"></button>
      <button class="theme-dot" data-set-theme="navy" aria-label="الثيم الكحلي" aria-pressed="false"></button>
      <button class="theme-dot" data-set-theme="blue" aria-label="ثيم أزرق أثَر" aria-pressed="false"></button>
    </div>
  </div>
</header>

<main>
  <!-- ============ ١) الدخول ============ -->
  <section class="screen active" id="screen-join">
    <form class="join" id="joinForm" autocomplete="off" novalidate>
      <div class="hero small" aria-hidden="true">
        <svg viewBox="0 0 320 210">
          <path class="h-rope" d="M6 20 Q160 58 314 20"/>
          <g class="h-bulbs"><g class="hb" style="--i:0"><path d="M16.3 22.9h4v4h-4z"/><circle cx="18.3" cy="31.9" r="5.5"/></g><g class="hb" style="--i:1"><path d="M42.1 28.2h4v4h-4z"/><circle cx="44.1" cy="37.2" r="5.5"/></g><g class="hb" style="--i:2"><path d="M67.8 32.5h4v4h-4z"/><circle cx="69.8" cy="41.5" r="5.5"/></g><g class="hb" style="--i:3"><path d="M93.6 35.7h4v4h-4z"/><circle cx="95.6" cy="44.7" r="5.5"/></g><g class="hb" style="--i:4"><path d="M119.4 37.8h4v4h-4z"/><circle cx="121.4" cy="46.8" r="5.5"/></g><g class="hb" style="--i:5"><path d="M145.1 38.9h4v4h-4z"/><circle cx="147.1" cy="47.9" r="5.5"/></g><g class="hb" style="--i:6"><path d="M170.9 38.9h4v4h-4z"/><circle cx="172.9" cy="47.9" r="5.5"/></g><g class="hb" style="--i:7"><path d="M196.6 37.8h4v4h-4z"/><circle cx="198.6" cy="46.8" r="5.5"/></g><g class="hb" style="--i:8"><path d="M222.4 35.7h4v4h-4z"/><circle cx="224.4" cy="44.7" r="5.5"/></g><g class="hb" style="--i:9"><path d="M248.2 32.5h4v4h-4z"/><circle cx="250.2" cy="41.5" r="5.5"/></g><g class="hb" style="--i:10"><path d="M273.9 28.2h4v4h-4z"/><circle cx="275.9" cy="37.2" r="5.5"/></g><g class="hb" style="--i:11"><path d="M299.7 22.9h4v4h-4z"/><circle cx="301.7" cy="31.9" r="5.5"/></g></g>
          <g class="h-spark"><circle r="20" class="glow"/><path d="M0-15l4 10 11 1-8 7 3 11-10-6-10 6 3-11-8-7 11-1z"/></g>
          <g class="h-waves"><path d="M70 150 Q110 112 150 104"/><path d="M118 140 Q140 116 156 106"/><path d="M202 140 Q180 116 164 106"/><path d="M250 150 Q210 112 170 104"/></g>
          <g class="h-phone p0"><rect x="-17" y="-30" width="34" height="60" rx="7"/><rect class="scr" x="-12" y="-23" width="24" height="40" rx="3"/><text y="3">💰</text></g>
          <g class="h-phone p1"><rect x="-17" y="-30" width="34" height="60" rx="7"/><rect class="scr" x="-12" y="-23" width="24" height="40" rx="3"/><text y="3">🎯</text></g>
          <g class="h-phone p2"><rect x="-17" y="-30" width="34" height="60" rx="7"/><rect class="scr" x="-12" y="-23" width="24" height="40" rx="3"/><text y="3">💣</text></g>
          <g class="h-phone p3"><rect x="-17" y="-30" width="34" height="60" rx="7"/><rect class="scr" x="-12" y="-23" width="24" height="40" rx="3"/><text y="3">📍</text></g>
        </svg>
      </div>
      <h1>سِجَال</h1>
      <label class="field"><span>رمز الغرفة</span><input id="codeIn" inputmode="numeric" maxlength="5" placeholder="٥ أرقام" required></label>
      <label class="field"><span>اسمك</span><input id="nameIn" maxlength="20" placeholder="اسمك في الساحة" required></label>
      <button class="btn btn-gold tactile big">ادخل</button>
      <p class="err" id="joinErr" hidden></p>
    </form>
  </section>

  <!-- ============ ٢) اختيار الفريق ============ -->
  <section class="screen" id="screen-team">
    <div class="pick-team">
      <h2>اختر فريقك</h2>
      <p class="lead">أول من يدخل الفريق يصير قائده، والمقدّم يقدر يغيّر.</p>
      <div class="team-pick" id="teamPick"></div>
    </div>
  </section>

  <!-- ============ ٣) الانتظار ============ -->
  <section class="screen" id="screen-wait">
    <div class="wait-card" id="waitCard"></div>
  </section>

  <!-- ============ ٤) اللعب ============ -->
  <section class="screen" id="screen-game">
    <div class="pbar" id="pbar"></div>
    <div class="pgame" id="pgame"></div>
  </section>
</main>

<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" hidden></div>
<div class="modal" id="confirm" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="modal-actions"><button class="btn btn-primary" id="confirmYes"></button><button class="btn" id="confirmNo">إلغاء</button></div>
  </div>
</div>

<script src="firebase-config.js?v=202611280004" defer></script>
<script src="../assets/athar-sound.js" defer></script>
<script src="net.js?v=202611280004" defer></script>
<script src="shared.js?v=202611280004" defer></script>
<script src="content.js?v=202611280004" defer></script>
<script src="maps.js?v=202611280004" defer></script>
<script src="reflex-art.js?v=202611280004" defer></script>
<script src="scenes.js?v=202611280004" defer></script>
<script src="bank.js?v=202611280004" defer></script>
<script src="price-art.js?v=202611280004" defer></script>
<script src="games.js?v=202611280004" defer></script>
<script src="play.js?v=202611280004" defer></script>
</body>
</html>
