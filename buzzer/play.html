<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>جرس أثَر | المشارك</title>
<meta name="description" content="ادخل برمز الغرفة واضغط الجرس من جوالك.">
<meta name="theme-color" content="#0A2463">
<!-- تطبيق الثيم المحفوظ قبل الرسم لتفادي الوميض -->
<script>
(function(){
  var t=null;
  try{ t=localStorage.getItem('athar-theme'); }catch(e){}
  if(['light','navy','blue'].indexOf(t)<0){
    t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'navy':'light';
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/athar.css">
<link rel="stylesheet" href="style.css">
<!-- إحصائيات الزيارات (Google Analytics) -->
<script src="../assets/athar-analytics.js" defer></script>
</head>
<body class="play">

<!-- ============ الشريط العلوي ============ -->
<header class="topbar">
  <a class="brand" href="./" aria-label="جرس أثَر">
    <img class="logo logo-main" src="../assets/athar-mark.png" alt="" width="52" height="60">
    <img class="logo logo-rev" src="../assets/athar-mark-reversed.png" alt="" width="52" height="60">
    <span class="brand-text">
      <strong id="meName">جرس أثَر</strong>
      <small id="meRoom">ادخل برمز الغرفة</small>
    </span>
  </a>
  <div class="top-tools">
    <span class="net" id="netDot" data-on="false" title="حالة الاتصال"><i></i><b id="netText">يتصل…</b></span>
    <button class="icon-btn snd" id="soundBtn" aria-pressed="true" aria-label="المؤثرات الصوتية">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </button>
    <!-- مبدّل الثيمات -->
    <div class="theme-switch" role="group" aria-label="ألوان الواجهة">
      <button class="theme-dot" data-set-theme="light" aria-label="الثيم الفاتح" aria-pressed="false"></button>
      <button class="theme-dot" data-set-theme="navy" aria-label="الثيم الكحلي" aria-pressed="false"></button>
      <button class="theme-dot" data-set-theme="blue" aria-label="ثيم أزرق أثَر" aria-pressed="false"></button>
    </div>
  </div>
</header>

<main>

  <!-- ============ ١) الدخول ============ -->
  <section class="screen active" id="screen-join">
    <form class="setup join" id="joinForm" autocomplete="off" novalidate>
      <div class="setup-hero">
        <div class="hero-buzzer" aria-hidden="true">
          <span class="ring"></span><span class="ring"></span><span class="ring"></span>
          <svg viewBox="0 0 200 160">
            <defs>
              <linearGradient id="hbDome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BDCFB"/><stop offset=".5" stop-color="#3B98EA"/><stop offset="1" stop-color="#1E6FE0"/></linearGradient>
              <linearGradient id="hbBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1547A8"/><stop offset="1" stop-color="#0A2463"/></linearGradient>
            </defs>
            <g class="spark"><path d="M100 38V20M64 48L53 35M136 48l11-13"/></g>
            <ellipse cx="100" cy="146" rx="70" ry="8" class="shadow"/>
            <path class="base" d="M28 112h144v16a10 10 0 0 1-10 10H38a10 10 0 0 1-10-10z" fill="url(#hbBase)"/>
            <ellipse cx="100" cy="112" rx="72" ry="12" fill="#1E6FE0" class="rim"/>
            <g class="dome"><path d="M46 111a54 54 0 0 1 108 0z" fill="url(#hbDome)"/>
            <ellipse cx="100" cy="111" rx="54" ry="7" fill="#0A2463" opacity=".35"/>
            <path d="M64 94a38 38 0 0 1 24-28" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".6"/></g>
            <path class="bolt" d="M104 117l-11 12h7l-4 8 12-13h-7z"/>
          </svg>
        </div>
        <h1>جرس أثَر</h1>
        <p class="lead">اكتب رمز الغرفة اللي على الشاشة، واسمك، وجهّز إصبعك.</p>
      </div>

      <div class="card">
        <label class="field">
          <span>رمز الغرفة</span>
          <input type="text" id="codeInput" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="5" dir="ltr" placeholder="• • • • •" aria-describedby="joinError">
        </label>
        <label class="field">
          <span>اسمك أو اسم فريقك</span>
          <input type="text" id="nameInput" maxlength="20" placeholder="مثلًا: فريق الصقور" enterkeyhint="go">
        </label>
        <p class="error" id="joinError" role="alert" hidden></p>
      </div>

      <button class="btn btn-primary btn-big" id="joinBtn" type="submit">ادخل الغرفة</button>
      <a class="home-link" href="./">أنا المقدّم وأبي أفتح غرفة ←</a>
    </form>
  </section>

  <!-- ============ ٢) الجرس ============ -->
  <section class="screen" id="screen-bell">
    <div class="bell-wrap" id="bellWrap" data-state="wait">
      <div class="bell-status">
        <h1 id="statusTitle"></h1>
        <p id="statusText"></p>
      </div>

      <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
      <button class="bell" id="bell" type="button" aria-label="اضغط الجرس">
        <span class="bell-ring" aria-hidden="true"></span>
        <span class="bell-face">
          <span class="bell-ico"><svg class="i-bell" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v3.6L4.3 16a1 1 0 0 0 .9 1.5h13.6a1 1 0 0 0 .9-1.5L18 12.6V9a6 6 0 0 0-6-6z"/><path d="M9.5 19.5a2.6 2.6 0 0 0 5 0z"/></svg><svg class="i-bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2L4 14h6.5l-1.5 8L19 9.5h-6.5L13.5 2z"/></svg><svg class="i-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10.5" rx="2.4"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></span>
          <span class="bell-label" id="bellLabel">اضغط</span>
          <span class="bell-sub" id="bellSub"></span>
        </span>
      </button>

      <ol class="mini-queue" id="miniQueue" aria-label="الترتيب"></ol>

      <button class="btn btn-ghost btn-small leave" id="leaveBtn" type="button">خروج من الغرفة</button>
    </div>
  </section>

</main>

<!-- ============ تنبيه عائم ============ -->
<div class="toast" id="toast" role="status" hidden></div>

<!-- ============ تأكيد ============ -->
<div class="modal" id="confirm" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle"></h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="confirmYes"></button>
      <button class="btn" id="confirmNo">إلغاء</button>
    </div>
  </div>
</div>

<script src="firebase-config.js" defer></script>
<script src="../assets/athar-sound.js" defer></script>
<script src="net.js" defer></script>
<script src="shared.js" defer></script>
<script src="play.js" defer></script>
</body>
</html>
