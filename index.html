<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ألعاب أثَر</title>
<meta name="description" content="ألعاب ومسابقات ثقافية من لجنة أثَر.">
<!-- تطبيق الثيم المحفوظ قبل الرسم لتفادي الوميض -->
<script>
(function(){
  var t=null;
  try{ t=localStorage.getItem('athar-theme'); }catch(e){}
  if(['light','navy','blue'].indexOf(t)<0){
    t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'navy':'light';
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/athar.css">
<link rel="stylesheet" href="home.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="logo logo-main" src="assets/athar-mark.png" alt="" width="52" height="60">
    <img class="logo logo-rev" src="assets/athar-mark-reversed.png" alt="" width="52" height="60">
    <span class="brand-name">ألعاب أثَر</span>
  </div>
  <div class="theme-switch" role="group" aria-label="ألوان الواجهة">
    <button class="theme-dot" data-set-theme="light" aria-label="الثيم الفاتح" aria-pressed="false"></button>
    <button class="theme-dot" data-set-theme="navy" aria-label="الثيم الكحلي" aria-pressed="false"></button>
    <button class="theme-dot" data-set-theme="blue" aria-label="ثيم أزرق أثَر" aria-pressed="false"></button>
  </div>
</header>

<main>
  <section class="hero">
    <img class="hero-logo logo-main" src="assets/athar-logo.png" alt="شعار لجنة أثَر" width="556" height="720">
    <img class="hero-logo logo-rev" src="assets/athar-logo-reversed.png" alt="شعار لجنة أثَر" width="556" height="720">
    <h1>وش نلعب اليوم؟</h1>
    <p class="lead">ألعاب ومسابقات ثقافية جماعية من لجنة أثَر. اختاروا لعبتكم وجهّزوا الفرق.</p>
  </section>

  <section class="games" aria-label="الألعاب">
    <!-- ترابيع -->
    <a class="game-card" href="tarabee/">
      <div class="game-art art-tarabee" aria-hidden="true">
        <i></i><i class="a"></i><i></i><i class="b"></i><i class="b"></i>
        <i class="a"></i><i class="a"></i><i class="a"></i><i></i><i class="b"></i>
        <i></i><i class="a"></i><i></i><i class="c"></i><i></i>
        <i class="c"></i><i></i><i class="c"></i><i class="c"></i><i class="c"></i>
      </div>
      <div class="game-body">
        <h2>ترابيع</h2>
        <p>جاوب صح واحتل المربعات… واقلب مربعات خصمك من الجنب.</p>
        <div class="tags"><span>فرق</span><span>أسئلة</span><span>من ٢ إلى ٦ فرق</span></div>
        <span class="play">العب الآن</span>
      </div>
    </a>

    <!-- مكان اللعبة القادمة -->
    <div class="game-card soon" aria-label="لعبة قادمة">
      <div class="game-art art-soon" aria-hidden="true"><span>؟</span></div>
      <div class="game-body">
        <h2>لعبة جديدة</h2>
        <p>قاعدين نجهّزها لكم… ترقبوها.</p>
        <span class="play">قريبًا</span>
      </div>
    </div>
  </section>
</main>

<footer class="foot">لجنة أثَر · اللجنة الثقافية والمسابقات والألعاب</footer>

<script src="home.js" defer></script>
</body>
</html>
